[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4eo"
version = "0.0.1"
description = "Agentic flood mapping workflow for India with altimetry cross-checks"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
# Pin exact versions after the first successful install (see docs/decisions.md).
dev = ["pytest", "ruff"]
data = ["earthaccess", "pystac-client", "planetary-computer"]
rag = ["langchain-text-splitters", "qdrant-client"]
agents = ["langgraph>=1.0", "langchain>=1.0", "pydantic>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
